[package]
name = "zhonghua-daozang"
version = "1.0.0"
description = "中華道藏 · 神仙圖鑑 Tauri 桌面應用"
edition = "2021"

[lib]
name = "zhonghua_daozang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
